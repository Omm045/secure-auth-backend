<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Secure account</title>
<link rel="stylesheet" href="/app/app.css">
<h1>Secure account</h1>
<form id="signup" autocomplete="on">
  <h2>Sign up</h2>
  <input name="email" type="email" autocomplete="email" required placeholder="Email">
  <input id="signup-password" name="password" type="password" minlength="15" maxlength="128" autocomplete="new-password" required placeholder="Password">
  <meter id="strength" min="0" max="4" value="0"></meter>
  <button>Sign up</button>
</form>
<form id="reset" autocomplete="on">
  <h2>Reset password</h2>
  <input id="reset-token" name="token" type="hidden">
  <input id="reset-password" name="new_password" type="password" minlength="15" maxlength="128" autocomplete="new-password" required placeholder="New password">
  <button>Reset password</button>
</form>
<script src="/app/app.js"></script>
