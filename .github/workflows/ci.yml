name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: secure-auth-backend:test
  compose-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: docker compose up -d postgres redis
      - run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U auth -d auth && \
              docker compose exec -T redis redis-cli ping && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - env:
        DATABASE_URL: postgres://auth:auth@localhost:5432/auth
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: compose-test-secret
        run: python -m pytest -q
      - run: docker compose down -v
