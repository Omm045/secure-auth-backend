<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Verify email</title>
<p id="status">Verifying your email…</p>
<script>
const token=new URLSearchParams(window.location.search).get('token')||'';
fetch('/auth/verify-email?token_value='+encodeURIComponent(token),{method:'POST'}).then(async response=>{document.querySelector('#status').textContent=(await response.json()).message||'Request completed'});
</script>
