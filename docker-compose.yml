services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    ports:
      - "6379:6379"
  app:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://auth:auth@postgres:5432/auth
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: development-compose-secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
